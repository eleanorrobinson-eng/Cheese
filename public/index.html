<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cheese</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="home-screen" class="screen">
    <div class="lights">💡 💡 💡 💡 💡</div>
    <div class="cafe-tables" aria-hidden="true">
      <div class="cafe-table">
        <div class="tablecloth-mini">
          <span>☕</span>
          <span class="mini-board"></span>
          <span>🧀</span>
        </div>
      </div>
      <div class="cafe-table">
        <div class="tablecloth-mini">
          <span>☕</span>
          <span class="mini-board"></span>
          <span>🧀</span>
        </div>
      </div>
      <div class="cafe-table">
        <div class="tablecloth-mini">
          <span>☕</span>
          <span class="mini-board"></span>
          <span>🧀</span>
        </div>
      </div>
      <div class="cafe-table">
        <div class="tablecloth-mini">
          <span>☕</span>
          <span class="mini-board"></span>
          <span>🧀</span>
        </div>
      </div>
    </div>
    <span class="critter" style="bottom: 2rem; left: 6%;">🐭</span>
    <span class="critter" style="bottom: 3rem; right: 8%;">🐭</span>
    <main class="cafe-sign">
      <h1>🧀 Cheese Cafe</h1>
      <p class="tagline">Pull up a seat and pick a table.</p>
      <div class="mode-buttons">
        <button id="mode-hotseat" class="mode-btn">Hot-seat</button>
        <button class="mode-btn" disabled title="Coming soon">Vs Computer</button>
        <button class="mode-btn" disabled title="Coming soon">Online</button>
      </div>
    </main>
  </div>

  <div id="game-screen" class="screen" hidden>
    <div class="tablecloth">
      <div id="board" class="board"></div>
    </div>
  </div>

  <div id="promotion-dialog" class="promotion-dialog" hidden>
    <div class="promotion-panel">
      <p>Promote to:</p>
      <div class="promotion-choices"></div>
    </div>
  </div>

  <script type="module" src="/board.js"></script>
</body>
</html>
