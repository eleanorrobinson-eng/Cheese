<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cheese</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="home-screen" class="screen">
    <div class="lights">💡 💡 💡 💡 💡</div>
    <div class="cafe-tables" aria-hidden="true">
      <div class="cafe-table">
        <div class="tablecloth-mini">
          <span>☕</span>
          <span class="mini-board"></span>
          <span>🧀</span>
        </div>
      </div>
      <div class="cafe-table">
        <div class="tablecloth-mini">
          <span>☕</span>
          <span class="mini-board"></span>
          <span>🧀</span>
        </div>
      </div>
      <div class="cafe-table">
        <div class="tablecloth-mini">
          <span>☕</span>
          <span class="mini-board"></span>
          <span>🧀</span>
        </div>
      </div>
      <div class="cafe-table">
        <div class="tablecloth-mini">
          <span>☕</span>
          <span class="mini-board"></span>
          <span>🧀</span>
        </div>
      </div>
    </div>
    <span class="critter" style="bottom: 2rem; left: 6%;">🐭</span>
    <span class="critter" style="bottom: 3rem; right: 8%;">🐭</span>
    <main class="cafe-sign">
      <h1>🧀 Cheese Cafe</h1>
      <p class="tagline">Pull up a seat and pick a table.</p>
      <div class="mode-buttons">
        <button id="mode-hotseat" class="mode-btn">Hot-seat</button>
        <button id="mode-vscomputer" class="mode-btn">Vs Computer</button>
        <button id="mode-online" class="mode-btn">Online</button>
      </div>
    </main>
  </div>

  <div id="game-screen" class="screen" hidden>
    <div class="game-layout">
      <div id="turn-indicator" class="turn-indicator"></div>
      <div class="tablecloth">
        <div id="board" class="board"></div>
      </div>
    </div>
  </div>

  <div id="handoff-banner" class="handoff-banner" hidden>
    <div class="handoff-panel">
      <p id="handoff-text"></p>
      <button id="handoff-ready-btn" class="mode-btn">Ready</button>
    </div>
  </div>

  <div id="game-over-banner" class="game-over-banner" hidden>
    <div class="game-over-panel">
      <p id="game-over-text"></p>
      <button id="play-again-btn" class="mode-btn">Play again</button>
    </div>
  </div>

  <div id="promotion-dialog" class="promotion-dialog" hidden>
    <div class="promotion-panel">
      <p>Promote to:</p>
      <div class="promotion-choices"></div>
    </div>
  </div>

  <div id="online-screen" class="screen" hidden>
    <div class="online-status-panel">
      <p id="online-status-text">Connecting…</p>
    </div>
  </div>

  <div id="online-join-dialog" class="modal-overlay" hidden>
    <div class="modal-panel">
      <p>Enter a room code to join:</p>
      <input id="room-code-input" class="room-code-input" type="text" maxlength="6" autocomplete="off" />
      <div>
        <button id="room-join-btn" class="mode-btn">Join Room</button>
      </div>
    </div>
  </div>

  <script type="module" src="/board.js"></script>
  <script type="module" src="/online.js"></script>
</body>
</html>
